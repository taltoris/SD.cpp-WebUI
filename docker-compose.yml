services:
  sd_container:
    container_name: sd_container

    build:
      context: .
      dockerfile: Dockerfile

    ports:
      - "5000:5000"
      - "8080:8080"

    volumes:
      - ./:/app/
      - /home/taltoris/Documents/docker/stable-diffusion.cpp/build/bin:/usr/local/bin:ro
      - /home/taltoris/Documents/docker/stable-diffusion.cpp/models:/app/models:ro
      - /home/taltoris/Documents/docker/stable-diffusion.cpp/output:/app/output

    devices:
      - /dev/dri:/dev/dri

    group_add:
      - "44"   # video
      - "110"  # render

    environment:
      FLASK_ENV: development
      LD_LIBRARY_PATH: /usr/local/bin

    command: python app.py

volumes:
  models:
  output:
  templates:
